name: Refresh Training Catalog

on:
  schedule:
    - cron: '0 3 * * 1'  # Every Monday at 03:00 UTC
  workflow_dispatch:       # Allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate catalog.json
        run: python scripts/refresh_catalog.py

      - name: Commit and push if catalog changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          if git diff --cached --quiet; then
            echo "catalog.json is up to date — no commit needed"
          else
            COUNT=$(python -c "import json; d=json.load(open('catalog.json')); print(d['count'])")
            git commit -m "chore: refresh training catalog (${COUNT} offerings)"
            git push
          fi
